# NOT INSTALLED. This skill is deliberately absent from skill_bundles.solvend.
# It is kept as a record of a design that this ZeroClaw release cannot express.
#
# WHY IT IS NOT REGISTERED
#
# A refund is meaningless without an invoice id, and tool arguments do not exist
# in v0.8.4. Verified 2026-08-06: [[tools]] accepts exactly name / kind /
# description / command, and adding [[tools.args]], an inline `args = [...]`, or
# [tools.parameters] makes ZeroClaw discard the entry — the skill installs,
# passes `skills audit`, and then never registers.
#
# The invoice skill works around this by making the item a *tool name*
# (invoice_water / invoice_cola / invoice_energy), because there are three items.
# That does not generalise to invoice ids. The remaining options were both worse:
#
#   * a no-arg `refund_request` that guesses which invoice the caller meant, or
#   * a registered tool that always fails at runtime, in the customer's chat.
#
# Separately, `sop_execute` is NOT in this release's tool list, so the agent
# could not have driven sops/refund-request/ regardless.
#
# WHAT HAPPENS INSTEAD
#
# Refunds are an operator action, run from the box:
#
#   solvend-run.sh refund-request INV-0412 "reason"   # opens it; resolves the
#                                                     # payer FROM CHAIN
#   solvend-run.sh refund-approve INV-0412            # emits a Solana Pay URI
#                                                     # the operator scans
#
# The controls that mattered are unchanged and still enforced in solvend.py:
# cmd_refund_request() takes no destination address — the payer is derived from
# the settling transaction (the owner whose USDC balance went down), and an
# ambiguous transaction resolves to None and fails closed. Custody stays T1;
# nothing here signs or moves funds.
#
# This is a net gain for the threat model. The chat-facing agent has no refund
# tool at all, so "get an attacker address into the refund path" has no entry
# point through conversation — there is no tool to call and no field to inject.
#
# To revive this as an agent skill, a ZeroClaw release must support tool
# arguments; then restore the [[tools]] entries below WITH their [tools.args]
# blocks and add "refund" back to skill_bundles.solvend.

[skill]
name = "refund"
description = "Operator-only refund flow. Not registered as an agent skill — see the comment above."
version = "0.1.0"
author = "solvend"
tags = ["solana", "refunds", "vending"]

# ---------------------------------------------------------------------------
# The intended tool surface, kept for the record. Commented out so that this
# file cannot silently register a tool that would fail in a customer's chat.
# Note what is NOT here even in the intended design: no tool takes a destination
# address, and no tool sends funds. The refund destination is not a parameter
# anywhere in this file. That absence is the control.
# ---------------------------------------------------------------------------
#
# [[tools]]
# name = "refund_request"
# kind = "script"
# description = "Open a refund for an invoice. Resolves the refund destination from the settling transaction on-chain. Returns an error for any invoice that is not refundable."
# command = "/opt/solvend/bin/solvend-run.sh refund-request"
#
#   [tools.args.invoice_id]
#   type = "string"
#   description = "Invoice ID, e.g. INV-0412. Must be one this thread already received."
#   required = true
#
#   [tools.args.reason]
#   type = "string"
#   description = "One-line reason, quoted from the customer. Advisory only; affects no decision."
#   required = false
#
# [[tools]]
# name = "refund_approve"
# kind = "script"
# description = "AFTER the operator checkpoint clears, emit an unsigned Solana Pay URI paying the on-chain payer. Post to the operator channel only. Does not move funds."
# command = "/opt/solvend/bin/solvend-run.sh refund-approve"
#
#   [tools.args.invoice_id]
#   type = "string"
#   description = "Invoice ID whose checkpoint was approved."
#   required = true
