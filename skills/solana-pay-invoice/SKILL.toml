# Tool definitions for the solana-pay-invoice skill.
#
# ONE TOOL PER ITEM, and no arguments anywhere. This is not a stylistic choice —
# it is what this ZeroClaw release supports. Verified 2026-08-06:
#
#   * `zeroclaw skills add` scaffolds SKILL.md ONLY. There is no SKILL.toml in the
#     canonical layout, and no argument concept anywhere in it.
#   * [[tools]] accepts exactly name / kind / description / command. Adding ANY
#     other key — [[tools.args]], an inline `args = [...]`, or [tools.parameters]
#     — makes ZeroClaw discard the whole entry: the skill installs, passes
#     `skills audit`, and then simply never registers. All three were tested.
#   * `command` DOES take arguments in the string (dispense-otp runs
#     "python3 /opt/solvend/solvend.py watch"), which is what makes this work.
#
# The upside is real: with no `item` parameter, "charge me 0.01 for a cola" has
# nothing to bind to at the tool boundary either, not just in solvend.ITEMS. The
# item is now a *tool name* the model selects, and an unknown item cannot be
# expressed at all.
#
# THE CALLER IS RESOLVED, NOT PASSED. Tool arguments do not exist, so the wrapper
# cannot be told who is asking. Instead new_invoice.py reads ZeroClaw's own
# session store (`session_metadata.channel_id` / `.room_id`) to find the customer
# currently in conversation. This generalises to any customer — nothing is
# hardcoded — and is stronger than a parameter would have been: the customer never
# supplies the value, so no message can claim to be someone else.
#
# Residual limit, stated in the README: two customers mid-turn on the same channel
# at the same instant could race on "most recent active session". Fine for a
# single-slot machine; a fleet would want the tool interface to pass the caller.

[skill]
name = "solana-pay-invoice"
description = "Issue a Solana Pay USDC invoice with a unique reference key."
version = "0.1.0"
author = "solvend"
tags = ["solana", "payments", "vending"]

[[tools]]
name = "invoice_water"
kind = "script"
description = "Issue a Solana Pay invoice for a WATER (1.00 USDC). Returns JSON containing a `uri` to give the customer. Use when the customer asks for water."
command = "/opt/solvend/bin/solvend-run.sh-invoice water"

[[tools]]
name = "invoice_cola"
kind = "script"
description = "Issue a Solana Pay invoice for a COLA (1.50 USDC). Returns JSON containing a `uri` to give the customer. Use when the customer asks for cola."
command = "/opt/solvend/bin/solvend-run.sh-invoice cola"

[[tools]]
name = "invoice_energy"
kind = "script"
description = "Issue a Solana Pay invoice for an ENERGY drink (2.50 USDC). Returns JSON containing a `uri` to give the customer. Use when the customer asks for an energy drink."
command = "/opt/solvend/bin/solvend-run.sh-invoice energy"
