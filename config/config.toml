# SolVend — ZeroClaw config
# Target: ~/.zeroclaw/config.toml on the Raspberry Pi 4
#
# Custody tier: T1 (BUILD). The agent holds NO private key. It constructs
# Solana Pay transfer-request URIs and reads getSignaturesForAddress.
# The customer's own wallet signs. Nothing here can move funds.
#
# Key legend:
#   [V] key name verified against docs.zeroclawlabs.ai/master/en/reference/config.html
#   [?] shape plausible but NOT verified — confirm with `zeroclaw config get <path>`

# ---------------------------------------------------------------------------
# MODEL PROVIDER
# A Pi 4 (4GB) cannot run a local model with reliable tool-calling. Use hosted.
# ---------------------------------------------------------------------------
[providers.models.gemini.main]                         # [V] providers.models.<type>.<alias>
model = "gemini-3.6-flash"                        # check current ID in Google AI Studio
api_key = "REDACTED"                                   # encrypted at rest when secrets.encrypt = true
timeout_secs = 30                                      # [V]
# Optional keys if you need them: uri (full endpoint override), temperature, max_tokens
#
# NOTE: `gemini` = HTTP API with an api_key (what you want).
#       `gemini_cli` is a DIFFERENT family that shells out to the local `gemini`
#       CLI binary — do not use it here.
#
# DATA DISCLOSURE: Gemini's free tier may use inputs to improve Google's models.
# Customer handles, item names, and refund payer addresses pass through the model.
# OTPs, the RPC key, and the ledger never do — those paths have no model in them.
# Declared in the README threat model. A production operator should use a paid
# tier or a local model.


# ---------------------------------------------------------------------------
# CHANNELS — two Telegram bots, deliberately separate
#
# Originally WhatsApp web mode. Changed 2026-08-06: `zeroclaw channel list` on
# the Pi reports "WhatsApp (configured, not compiled)" — the stock release binary
# ships without the WhatsApp feature, so no configuration can enable it. Getting
# it needs a from-source build (`--features channels-full`), which on a Pi 4 is a
# multi-hour Rust compile with real OOM risk. Telegram is compiled, long-polls
# (so still no ingress, no tunnel, no app review), and costs the design nothing:
# the customer talks to a chat bot either way.
#
# TWO SEPARATE BOTS, not one with two aliases. The security property is that
# approvals leave the customer's reach — a customer must not be able to send
# messages anywhere near the approval route. Same-bot separation would rest only
# on the chat-id membership check; separate bots make it structural. Create the
# second one in BotFather, it takes a minute.
# ---------------------------------------------------------------------------
[channels.telegram.shop]                               # [V] channels.telegram.<alias>
enabled = true
bot_token = "REDACTED-CUSTOMER-BOT"                    # customer-facing bot
dm_policy = "all"                                      # [V] allowlist | ignore | all — customers DM the vending machine
group_policy = "ignore"                                # [V] no group traffic
interrupt_on_new_message = false                       # [V] never abandon a half-finished invoice

# Operator channel. Telegram long-polls, so it also needs no ingress.
# Approvals and refund checkpoints route here, NOT to the customer channel.
[channels.telegram.operator]                           # [V] channels.telegram.<alias>
enabled = true
bot_token = "REDACTED-OPERATOR-BOT"                    # [V] a DIFFERENT bot from telegram.shop


# ---------------------------------------------------------------------------
# HTTP TOOL — the entire Solana surface at T1
# allowed_domains is your real security boundary. Keep it to two hosts.
# ---------------------------------------------------------------------------
[http_request]                                         # [V]
enabled = true                                         # [V]
allowed_domains = [                                    # [V] default is ["*"] — do NOT leave it open
  "mainnet.helius-rpc.com",
  "api.mainnet-beta.solana.com",                       # fallback if Helius rate-limits
]
allow_private_hosts = false                            # [V] SSRF guard stays on
timeout_secs = 15                                      # [V] default 30
max_response_size = 262144                             # [V] 256 KiB. Trap #3: a fat RPC reply nukes your context.

# RPC key handling. Bounty rule: keys live in config, never in code, never in a
# skill body (skill text is model-visible and lands in the transcript).
#
# There was a [http_request.secrets.helius] table here. REMOVED 2026-08-06:
# ZeroClaw has no such schema, and an unrecognised sub-table does not fail
# loudly — `zeroclaw doctor` reported "config section 'http_request' is malformed
# and was reset to defaults", which silently restored allowed_domains = ["*"] and
# turned off the SSRF guard. The one section whose whole job is to be a security
# boundary was the one being discarded, and nothing about the running system
# looked wrong. Verified fixed on the Pi: 0 errors once the table was gone.
#
# No key is needed here anyway. solvend.py reaches Helius via SOLVEND_RPC_URL from
# /etc/solvend/env (chmod 600), never through the http_request tool — which stays
# enabled and domain-locked as hardening, not as a dependency.


# ---------------------------------------------------------------------------
# RISK PROFILE — fail-closed
# ---------------------------------------------------------------------------
[risk_profiles.vending]                                # [V] risk_profiles.<alias>
allowed_commands = []                                  # [V] no shell for the chat-facing agent
excluded_tools = ["browser", "file_download"]          # [V] strips tools from every non-CLI channel
forbidden_paths = ["~/.zeroclaw/config.toml", "/var/lib/zeroclaw"]   # [V]

[risk_profiles.vending.approval_route]                 # [V]
approver_channel = "telegram.operator"                 # [V] approvals leave the customer's reach
timeout_secs = 300                                     # [V] default 120
on_no_approver = "deny"                                # [V] fail closed — this is the line judges look for

[runtime_profiles.vending]                             # [V] runtime_profiles.<alias>
max_iterations = 8                                     # [?] caps a runaway tool loop


# ---------------------------------------------------------------------------
# SKILLS
# ---------------------------------------------------------------------------
[skill_bundles.solvend]                                # [V] skill_bundles.<alias>
skills = ["solana-pay-invoice", "dispense-otp", "refund"]   # [?] confirm key name (skills vs members)


# ---------------------------------------------------------------------------
# AGENT
# ---------------------------------------------------------------------------
[agents.solvend]                                       # [V] agents.<alias>
enabled = true                                         # [V]
channels = ["telegram.shop", "telegram.operator"]      # [V]
model_provider = "gemini.main"                         # [V] "<type>.<alias>" — NOT the full
                                                       # providers.models.* path. Validated at
                                                       # startup, so a wrong value fails loudly.
risk_profile = "vending"                               # [V]
runtime_profile = "vending"                            # [V]
skill_bundles = ["solvend"]                            # [V]

[agents.solvend.memory]                                # [V] per-agent memory backend
enabled = true                                         # operator preferences and conversation continuity ONLY.
                                                       # The invoice ledger is NOT here — see note below.

# Where the SOP engine finds payment-watcher/
sops_dir = "/var/lib/zeroclaw/agents/solvend/workspace/sops"   # [?] confirm key name; default is <workspace>/sops

# LEDGER LOCATION — deliberate. Invoice state lives in /var/lib/solvend/solvend.db,
# owned by solvend.py, NOT in agent memory. Agent memory is written and read
# through the model, which makes it non-atomic and injectable; "mark this invoice
# paid" is a sentence someone can put in a Telegram message. Money state belongs
# behind a UPDATE...WHERE the model cannot reach.


# ---------------------------------------------------------------------------
# SOP ENGINE — cron dispatch requires the maintenance tick
# ---------------------------------------------------------------------------
[scheduler]                                            # [V]
maintenance_interval_secs = 60                         # [V] default 60; cron SOPs are polled by this tick,
                                                       # so 60s is your true floor on payment-detection latency

# ---------------------------------------------------------------------------
# MINUTE POLLER — shell cron job, NOT an SOP, NOT an agentic run.
# The payment-watcher SOP is retained for manual/observability runs, but this
# is what actually polls: 1440 executions/day at zero tokens. The model is
# invoked only when solvend-poll.sh decides there is something to decide.
# ---------------------------------------------------------------------------
[cron.solvend_poll]                                    # [V] cron.<alias>, shell or agentic
enabled = true
schedule = "* * * * *"                                 # [?] confirm key name (schedule vs expression)
kind = "shell"                                         # [?] confirm discriminator
command = "/opt/solvend/bin/solvend-poll.sh"
timeout_secs = 45                                      # must stay under the 60s tick

# ---------------------------------------------------------------------------
# REFUND APPROVALS — gateway subjects, not chat handles.
# ---------------------------------------------------------------------------
[sop.approval.groups.shop_operator]                    # [V] structure from sop/syntax.md
members = ["http:OPERATOR_SUBJECT_ID"]                 # [?] confirm a telegram: scheme exists;
                                                       # if not, approve via `zeroclaw sop approve`

[sop.approval.policies.refund]                         # [V]
required_group = "shop_operator"
quorum = 1
request_route = "telegram.operator:OPERATOR_CHAT_ID"   # [V] request_route format from docs

[security]
encrypt = true                                         # [?] confirm exact path (secrets.encrypt vs security.encrypt)
